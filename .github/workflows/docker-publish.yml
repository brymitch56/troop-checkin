# Builds and publishes the container image to GitHub Container Registry:
#   ghcr.io/brymitch56/troop-checkin
#
# Fires on every version tag (v*) — so cutting a release publishes its image
# automatically — and can be run by hand from the Actions tab
# (workflow_dispatch), which publishes :latest from the chosen ref.
#
# Multi-arch: linux/amd64 (PCs, NAS) + linux/arm64 (Pi 4/5 on 64-bit OS).
# better-sqlite3 ships prebuilds for both, so the emulated arm64 leg only
# downloads — no compiling.
#
# Note: while the repo is private the package is private too — adopters can
# `docker pull` without auth only once the repo/package is public.
name: Publish Docker image

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
