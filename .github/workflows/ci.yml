# CI for troop-checkin.
#
# `test` (node:test suite) is the REQUIRED gate — it must be green on every
# push/PR to main. It includes the startup self-check tests, so a commit that
# breaks a core module's exports fails here before it can ever reach the Pi.
#
# `e2e-browser` is a SEPARATE, advisory job (continue-on-error): real-Chrome
# puppeteer runs can be flaky on shared runners and must never block the
# required unit gate. Treat a red E2E as a prompt to run it locally
# (`npm install --no-save puppeteer && node test/e2e-browser.js`), not as
# noise to ignore.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Both supported host OSes (Linux covers the Pi and Docker; Windows is a
  # first-class target). The suite must be green on BOTH — the windows leg is
  # required, not advisory.
  test:
    name: node:test suite (required, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          DATA_DIR: ${{ runner.temp }}/tc-data

  # Image builds, boots, passes /healthz, and an unconfigured container
  # redirects to the /setup wizard — the Docker quickstart in one smoke test.
  docker:
    name: docker build + boot smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t troop-checkin:ci .
      - name: boot container and probe
        run: |
          docker run -d --name tc -p 3000:3000 troop-checkin:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000/healthz && break
            sleep 1
          done
          curl -fsS http://localhost:3000/healthz | grep -q '"ok":true' || { docker logs tc; exit 1; }
          # fresh container = unconfigured -> the wizard must answer
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/)
          [ "$code" = "302" ] || { echo "expected 302 to /setup, got $code"; docker logs tc; exit 1; }
          curl -fsS http://localhost:3000/setup | grep -q 'first-time setup' || { docker logs tc; exit 1; }
      - name: container healthcheck reaches healthy
        run: |
          for i in $(seq 1 12); do
            status=$(docker inspect --format '{{.State.Health.Status}}' tc)
            [ "$status" = "healthy" ] && exit 0
            sleep 5
          done
          echo "healthcheck never turned healthy"; docker inspect tc | tail -40; exit 1

  e2e-browser:
    name: browser E2E (advisory, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm install --no-save puppeteer
      # Chrome's shared-library deps (libXdamage & friends — see the e2e notes
      # in SESSION-NOTES.md). Package names differ across Ubuntu releases
      # (libasound2 vs libasound2t64), so fall back rather than fail the job
      # on a rename; most are preinstalled on GitHub runners anyway.
      - name: Install Chrome system libraries
        run: |
          sudo apt-get update
          for pkg in libxdamage1 libxcomposite1 libxrandr2 libxkbcommon0 libgbm1 \
                     libatk1.0-0 libatk-bridge2.0-0 libcups2 libnss3 libnspr4 \
                     libpango-1.0-0 libcairo2 libasound2t64; do
            sudo apt-get install -y "$pkg" || echo "skipping $pkg (not in this release)"
          done
          sudo apt-get install -y libasound2 || true
      - run: node test/e2e-browser.js
        env:
          DATA_DIR: ${{ runner.temp }}/tc-e2e-data
